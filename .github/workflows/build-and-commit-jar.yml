# This workflow will build a package using Maven and then publish it to GitHub packages when a release is created
# For more information see: https://github.com/actions/setup-java#apache-maven-with-a-settings-path

name: Rebuild CLI JAR file
on:
  pull_request:
    branches:
      - master
jobs:
  build-and-commit-cli-jar:
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2
        with:
          ref: ${{ github.head_ref }}
          # The dedicated SWAGGER_CODEGEN_REPO_ACCESS_TOKEN secret holds a dead
          # credential, so checkout fails with it; the default token works for
          # checkout and for the auto-commit (whose push then triggers nothing,
          # which the actor guard below already wants)

      - name: Build JAR
        # Build only the CLI module and its dependencies: the full build includes
        # the swagger-generator war, whose swagger-ui download references an
        # upstream branch that no longer exists
        run: |
          mvn clean package -DskipTests -pl modules/swagger-codegen-cli -am

      - name: Copy JAR to root directory
        run: |
          cp -f modules/swagger-codegen-cli/target/swagger-codegen-cli.jar .

      - name: Commit updated JAR file
        if: github.actor != 'scoffableautomation' # If this run was already triggered by an automated commit, this avoids a potential infinite loop
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: Regenerated Swagger CLI JAR
